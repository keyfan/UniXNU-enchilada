# Board description of the OnePlus 6 (enchilada, SDM845), read by the unixnu build driver.
# Adapted from UniXNU-sheng (BSD-2-Clause-Patent). Board-specific values marked with TODO must be
# filled from the device — see 一加6-真机实施手册.md section S2.

[board]
name = "enchilada"
soc = "SDM845"
description = "OnePlus 6"
kit = "enchilada"                    # the package/ of this repository appears as kits/enchilada in the build tree

# The target OS image: the unchanged iPad7,1 iPadOS 17.7.11 restore image (same image UniXNU-sheng
# uses, verified against api.ipsw.me). Give --ipsw PATH to use a local file; without it the remote
# url is read with range requests, only the members that are needed.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]   # the small components

# Same IPSW as sheng, so the member pins are identical.
[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# first_lba and last_lba are the GPT entry "userdata" of LUN 0 (sda17), read from this unit on 2026-10-23
# (sgdisk --print /dev/block/sda; verified against the raw GPT entry in backup/gpt-sda.bin).
[userdata]
first_lba = 0x186f40
last_lba = 0xe217fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "enchilada_defconfig"
# Archive builders of the kernel step, in order. Each is a script of the build tree with its arguments.
# 首启精简集（控制台优先）：sheng 的 build-boot-progress / NativeAdreno / legacy-display 构建器
# 依赖 kits/sheng 源码与 GMU 固件，待 P7/P8 移植对应 kit 后再加回（含 defconfig 的对应 CONFIG）。
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py SoftwareAES",
  "build-mockfs-fixture.py",
  "build-native-aes-bindings.py --objects-dir build/native-aes",
  # "build-arm-driver.py NativeUfs",   # P6: NativeUfs 编译期绑定 VerifiedRoot/BootProgress/IOBlockStorageDevice
                                        # 原始符号（build-arm-driver.py 强制 -DNATIVE_VERIFIED_BLOCK），需整链补齐后加回
  "build-enchilada-stubs.py",
  # "build-enchilada-platform-power.py",   # P6: SDM845 PMGR, required for native-ufs-root=1
  "build-libpthread-kernel.py",
  # P6+（payload/Data seed 需要；build-native-virtio-bindings 依赖 pre_build 产出的
  # build/storage-abi/interface-audit.json，见 unixnu.com/building 的 pre_build 节）:
  # "build-arm-driver.py NativeVirtioBlock",
  # "build-arm-driver.py NativeRamBlock",
  # "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  # "build-native-virtio-bindings.py --component NativeVirtioBlock",
  # P7/P8（需 kits/enchilada + GMU 固件）:
  # "build-boot-progress.py",
  # "build-arm-driver.py NativeAdreno",
  # "build-native-adreno-kits.py",
  # "build-native-adreno-accelerator.py",
  # "build-native-legacy-display.py",
]

# The prelink inputs describe the iPad7,1 21H461 kernelcache; same IPSW, so same values as sheng.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
config = "enchilada"               # Resources/Configs/enchilada.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/OnePlus/enchiladaPkg/enchilada.dsc"
fd = "Build/enchiladaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-enchilada.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]   # Qualcomm GICv3 spurious interrupt fix, same as sheng
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "enchilada"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "enchilada-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and
# the optional trust cache and Data seed. The loader (DarwinBoot) is part of the firmware volume.
[payload]
volume = "ONEPLUS6ESP"
size_mib = 192
# "firmware" = Mu-Silicium FV embeds DarwinBoot (U-2 path). We run Renegade UEFI, so use the
# standalone driver instead: the payload step adds [[driver]] path = "Payloads/DarwinBoot.efi"
# and CI injects the built DarwinBoot.efi into the FAT volume.
loader = "DarwinBoot"
title = "enchilada first boot: source 4K XNU to console"
dram_size = "0x180000000"            # 6 GiB unit, confirmed (MemTotal 5765952 kB on this phone)
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
# entry-probe + panic screen: patched into the payload kernel copy. Addresses measured from
# our kernel.macho (2026-10-23): entry=0xfffffff0073ec488, _panic=0xfffffff00797a828,
# MMU=0xfffffff0073ee350. Stage bars + panic text on the framebuffer.
panic_screen = true
entry_probe_reset_delay = 6
entry_probe_reset_after = "_stackshot_init"
entry_probe_reset_in = "_kernel_bootstrap"
entry_probe_reset_occurrence = 1
# The original static/System trust caches of the 21H461 image (same IPSW as sheng).
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  "armcpu-diagnostics=1",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # P6 (PMGR + UFS root) 后追加:
  # "native-ufs-root=1",
  # "enchilada-pmgr=2",
  # 触控/GPU 就绪后追加 "enchilada-touch=..."、"enchilada-gpu-..."（对照 sheng 的 sheng-* 参数）
]

# Fixups of signed text, applied by the kernel after signature validation (patches/xnu/native-text-fixup.patch).
# These target the shared cache of the 21H461 userland, so they carry over unchanged from sheng:
# they fix the SpringBoard startup deadlock, PosterBoard migration and the BTAudioHALPlugin spin.
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
tool = "scripts/make-enchilada-adt.py"
chip_id = "208"                      # software identity seed (207 is sheng's); pairs with --unique-chip-id
owned_memory_size = "0x10000000"    # DarwinBoot contiguous window (256MB min). Renegade UEFI cannot provide 4.875GB contiguous.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # OS volume UUID of iPad7,1 21H461, same as sheng
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"   # measured from the stock DTB (cpu@0..cpu@700, Affinity1); 4x A75 + 4x A55
packed_data_ramdisk = true
persistent_data = true               # Data writes persist, so Data is not ephemeral storage
ipad_identity = true                 # same iPad7,1 identity as the userland image
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config (uefi-enchilada/Resources/Configs/enchilada.toml);
# [bootimg.image] would override them.

# The SDM845 ABL may power the panel off when the device tree has no splash region (sheng hit this).
# Values measured from the stock boot_a DTB: /reserved-memory/cont_splash_region@9d400000.
# Keep this node only if the ABL drops the splash without it (the UEFI tree may lack the region).
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0x9d400000", "0x0", "0x2400000"] },
]
